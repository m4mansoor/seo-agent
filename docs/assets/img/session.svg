<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" font-size="17">
  <rect width="1280" height="790" fill="#F7F6F2"/>
  <rect x="40" y="30" width="1200" height="730" rx="8" fill="#FFFFFF" stroke="#DAD7CE"/>
  <text x="70" y="66" fill="#7C8590" font-size="14">Claude Code · seo-agent connected · free list</text>
  <g>
    <rect x="70" y="86" width="1140" height="46" rx="6" fill="#EEEDE7"/>
    <text x="90" y="115" fill="#1C2229" font-weight="600">I need 5 dofollow backlinks, DA 60 or higher.</text>
  </g>
  <g>
    <text x="90" y="170" fill="#0F6E6A" font-weight="600">Agent</text>
    <text x="90" y="196" fill="#1C2229">Which URL should the links point to, and what are the main keywords?</text>
  </g>
  <g>
    <rect x="70" y="216" width="1140" height="46" rx="6" fill="#EEEDE7"/>
    <text x="90" y="245" fill="#1C2229" font-weight="600">https://lmrify.com, keywords "product reviews" and "amazon review".</text>
  </g>
  <g>
    <text x="90" y="300" fill="#0F6E6A" font-weight="600">Agent</text>
    <text x="90" y="326" fill="#1C2229">Planned 5 links from the free list, all dofollow, average DA 80. Anchors: 1 exact, 1 partial, 2 branded, 1 naked. Building now.</text>
    <g font-size="15">
      <rect x="90" y="346" width="1100" height="34" fill="#F7F6F2"/>
      <text x="104" y="368" fill="#7C8590" font-weight="600">SITE</text><text x="300" y="368" fill="#7C8590" font-weight="600">DA</text><text x="360" y="368" fill="#7C8590" font-weight="600">LINK</text><text x="470" y="368" fill="#7C8590" font-weight="600">METHOD</text><text x="720" y="368" fill="#7C8590" font-weight="600">ANCHOR</text><text x="960" y="368" fill="#7C8590" font-weight="600">STATUS</text>
      <text x="104" y="404" fill="#1C2229">Medium</text><text x="300" y="404">96</text><text x="360" y="404" fill="#2C7A4B">dofollow</text><text x="470" y="404">Article or blog post</text><text x="720" y="404">product reviews</text><text x="960" y="404" fill="#2C7A4B" font-weight="600">placed · verified</text>
      <text x="104" y="434" fill="#1C2229">IMDB</text><text x="300" y="434">95</text><text x="360" y="434" fill="#2C7A4B">dofollow</text><text x="470" y="434">Profile website field</text><text x="720" y="434">LMRIFY</text><text x="960" y="434" fill="#2C7A4B" font-weight="600">placed · verified</text>
      <text x="104" y="464" fill="#1C2229">Zotero</text><text x="300" y="464">75</text><text x="360" y="464" fill="#2C7A4B">dofollow</text><text x="470" y="464">Bookmark / link submit</text><text x="720" y="464">lmrify.com</text><text x="960" y="464" fill="#2C7A4B" font-weight="600">placed · verified</text>
      <text x="104" y="494" fill="#1C2229">ArtFire</text><text x="300" y="494">75</text><text x="360" y="494" fill="#2C7A4B">dofollow</text><text x="470" y="494">Profile website field</text><text x="720" y="494">best product reviews</text><text x="960" y="494" fill="#2C7A4B" font-weight="600">placed · verified</text>
      <text x="104" y="524" fill="#1C2229">ouo.press</text><text x="300" y="524">60</text><text x="360" y="524" fill="#7C8590">redirect</text><text x="470" y="524">URL shortener</text><text x="720" y="524">https://lmrify.com</text><text x="960" y="524" fill="#B9761F" font-weight="600">unverified</text>
    </g>
  </g>
  <g>
    <text x="90" y="580" fill="#0F6E6A" font-weight="600">Agent</text>
    <text x="90" y="606" fill="#1C2229">Done: 4 verified live and dofollow, 1 unverified (a redirect page shows the URL as text, not as a link). Each verified</text>
    <text x="90" y="630" fill="#1C2229">link was checked on its public page for the hyperlink, the anchor text and nofollow. Proof screenshots are saved.</text>
    <text x="90" y="654" fill="#1C2229">Want me to replace the unverified one? The library has 117 more sites at DA 90+ with a subscription.</text>
  </g>
  <rect x="70" y="688" width="1140" height="42" rx="6" fill="#0E5F5B"/>
  <text x="90" y="715" fill="#FFFFFF">Replace it with another free site first, and keep the same anchor mix.</text>
</svg>
