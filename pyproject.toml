[project]
name = "seo-agent"
version = "0.2.0"
description = "Open-source SEO agent for link building. Plans campaigns and builds backlinks from Claude, Cursor or Codex via MCP. 1,245-site library."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["seo", "seo-agent", "ai-seo", "link-building", "backlinks", "mcp", "mcp-server", "seo-automation", "claude", "cursor"]
dependencies = ["mcp>=1.10,<2", "pydantic>=2.7", "playwright>=1.50"]

[project.scripts]
seo-agent = "seoagent.server:main"

[project.urls]
Homepage = "https://github.com/m4mansoor/seo-agent"
Documentation = "https://m4mansoor.github.io/seo-agent/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seoagent"]
